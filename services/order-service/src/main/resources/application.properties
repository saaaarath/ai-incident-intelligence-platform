spring.application.name=order-service
spring.datasource.url=${ORDER_DB_URL}
spring.datasource.username=${ORDER_DB_USERNAME}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8081}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
downstream.connect-timeout-ms=${DOWNSTREAM_CONNECT_TIMEOUT_MS:2000}
downstream.read-timeout-ms=${DOWNSTREAM_READ_TIMEOUT_MS:3000}
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
