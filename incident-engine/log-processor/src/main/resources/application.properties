spring.application.name=log-processor
server.port=8080

spring.datasource.url=${LOG_PROCESSOR_DB_URL:jdbc:postgresql://localhost:5432/incident_platform}
spring.datasource.username=${LOG_PROCESSOR_DB_USERNAME:incident_user}
spring.datasource.password=${LOG_PROCESSOR_DB_PASSWORD:incident_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:log-processor-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

kafka.topic.application-logs=application-logs

metrics.aggregation.default-window-minutes=1
metrics.aggregation.default-window-seconds=60
