services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_platform
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data

  init-kafka:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # Create required topics
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic application-logs --replication-factor 1 --partitions 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic service-events --replication-factor 1 --partitions 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic deployment-events --replication-factor 1 --partitions 1

      echo 'Kafka topics configured:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/incident_platform
      PAYMENT_DB_USERNAME: incident_user
      PAYMENT_DB_PASSWORD: incident_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-service:
    build:
      context: ..
      dockerfile: services/inventory-service/Dockerfile
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/incident_platform
      INVENTORY_DB_USERNAME: incident_user
      INVENTORY_DB_PASSWORD: incident_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/incident_platform
      ORDER_DB_USERNAME: incident_user
      ORDER_DB_PASSWORD: incident_password
      PAYMENT_SERVICE_URL: http://payment-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      DOWNSTREAM_CONNECT_TIMEOUT_MS: 2000
      DOWNSTREAM_READ_TIMEOUT_MS: 3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20

  log-processor:
    build:
      context: ..
      dockerfile: incident-engine/log-processor/Dockerfile
    environment:
      LOG_PROCESSOR_DB_URL: jdbc:postgresql://postgres:5432/incident_platform
      LOG_PROCESSOR_DB_USERNAME: incident_user
      LOG_PROCESSOR_DB_PASSWORD: incident_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${LOG_PROCESSOR_PORT:-18084}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  kafka-data: